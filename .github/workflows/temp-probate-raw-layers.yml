name: Temporary Probate Raw Layer Capture

on:
  push:
    branches:
      - temp-probate-fetch-20260829-run
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install selenium
      - name: Capture raw rendering layers
        run: python scripts/capture_probate_raw_layers.py
      - name: Upload raw layers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probate-raw-layers
          path: probate_raw_layers
          if-no-files-found: warn
